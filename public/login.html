<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dist/output.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
  </style>
</head>
<body class="antialiased">
<!-- Login Page with Image -->
<main class="min-h-screen flex flex-col items-center justify-center">
   <div class="py-4 px-4 md:px-8">
      <div class="grid items-center gap-6 max-w-6xl w-full lg:grid-cols-2">
         <div class="border border-slate-300 rounded-lg p-6 max-w-md mx-auto shadow-sm md:p-8 lg:mx-0">

            <div class="mb-8">
               <h1 class="text-slate-900 text-3xl font-bold mb-4">Sign in</h1>
               <p class="text-slate-600 text-base leading-relaxed">Sign in to your account to access
                  your dashboard and manage your projects.</p>
            </div>

            <form class="space-y-6" id="loginForm">
               <div>
                  <label for="userName" class="mb-2 text-slate-900 font-medium text-sm inline-block">userName</label>
                  <input type="text" id="userName" name="userName" placeholder="john" required="" class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600">
               </div>
               <div>
                  <label for="password" class="mb-2 text-slate-900 font-medium text-sm inline-block">Password</label>
                  <input type="password" id="password" name="password" placeholder="••••••••" required="" class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600">
               </div>

               <div class="flex items-start flex-wrap gap-2">
                  <label class="flex items-center group has-[input:checked]:text-slate-900">
                     <input id="remember" name="remember" type="checkbox" required="" class="sr-only">
                     <!-- Custom box -->
                     <span class="flex h-4 w-4 shrink-0 items-center justify-center rounded outline-1 outline-slate-300 bg-white group-has-[input:checked]:bg-blue-600 group-has-[input:checked]:outline-blue-600 group-focus-within:outline-2 group-focus-within:outline-blue-600" aria-hidden="true">
                        <!-- Checkmark -->
                        <svg class="size-3 text-white opacity-0 group-has-[input:checked]:opacity-100" viewBox="0 0 12 10" fill="none" stroke="currentColor" stroke-width="2">
                           <path d="M1 5l3 3 7-7"></path>
                        </svg>
                     </span>
                     <span class="ml-3 text-sm text-slate-700">
                        Remember me
                     </span>
                  </label>

                  <a href="#" class="ml-auto text-sm font-medium text-blue-700 hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded">
                     Forgot password?
                  </a>
               </div>

               <button type="submit" class="w-full py-2 px-3.5 text-sm rounded-md font-semibold cursor-pointer tracking-wide text-white border border-blue-600 bg-blue-600 hover:bg-blue-700 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                  Sign in</button>

               <div class="text-slate-900 text-sm text-center">Don't have an account? <a href="#" class="text-blue-700 hover:underline ml-1 font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded">Sign
                     up</a>
               </div>
            </form>
         </div>

         <div class="aspect-[71/50] max-lg:w-4/5 mx-auto">
            <img src="https://readymadeui.com/images/integration-illus.webp" class="w-full object-cover" alt="login img">
         </div>
      </div>
   </div>
</main>
<script src="/js/login.js"></script>
</body>
</html>
