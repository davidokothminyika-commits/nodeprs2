<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="../dist/output.css">
    <title>modal</title>
</head>
<body>
    <div id="modalOverlay"
   class="fixed inset-0 p-4 flex flex-wrap justify-center items-center w-full h-full z-[1000] before:fixed before:inset-0 before:w-full before:h-full before:bg-[rgba(0,0,0,0.5)]">
   <div role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"
      class="w-full max-w-md bg-white border border-slate-100 shadow-lg rounded-lg relative max-h-[95vh] overflow-y-auto outline-none p-4 md:p-6 dark:bg-neutral-800 dark:border-neutral-700">

      <button type="button" id="closeModal" aria-label="Close modal"
         class="flex items-center absolute top-6 right-6 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded">
         <svg xmlns="http://www.w3.org/2000/svg"
            class="size-3 cursor-pointer fill-slate-500 hover:fill-red-600 dark:fill-slate-400 dark:hover:fill-red-500"
            aria-hidden="true" viewBox="0 0 329.269 329">
            <path
               d="M194.8 164.77 323.013 36.555c8.343-8.34 8.343-21.825 0-30.164-8.34-8.34-21.825-8.34-30.164 0L164.633 134.605 36.422 6.391c-8.344-8.34-21.824-8.34-30.164 0-8.344 8.34-8.344 21.824 0 30.164l128.21 128.215L6.259 292.984c-8.344 8.34-8.344 21.825 0 30.164a21.27 21.27 0 0 0 15.082 6.25c5.46 0 10.922-2.09 15.082-6.25l128.21-128.214 128.216 128.214a21.27 21.27 0 0 0 15.082 6.25c5.46 0 10.922-2.09 15.082-6.25 8.343-8.34 8.343-21.824 0-30.164zm0 0" />
         </svg>
      </button>

      <div class="text-center">
         <div class="w-14 h-14 p-3 mb-4 mx-auto rounded-full bg-green-50 dark:bg-green-300/20" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-full fill-green-500 inline overflow-visible"
               viewBox="0 0 24 24">
               <path fill-rule="evenodd"
                  d="M22.514 5.037a1.22 1.22 0 0 1 0 1.726l-12.2 12.2a1.22 1.22 0 0 1-1.725 0l-6.1-6.1a1.22 1.22 0 1 1 1.725-1.726l5.237 5.238L20.79 5.037a1.22 1.22 0 0 1 1.725 0"
                  clip-rule="evenodd" data-original="#000000" />
            </svg>
         </div>
         <h3 id="modal-title" class="text-slate-900 text-base font-semibold dark:text-slate-50">Request approved
            successfully</h3>
         <p class="text-slate-600 text-sm mt-2 leading-relaxed dark:text-slate-400">Your request has been successfully
            processed. If this wasn’t intended, please contact support right away.</p>
      </div>

      <div class="mt-6">
         <button type="button"
            class="px-3.5 py-2 w-full text-white text-sm font-semibold rounded-md cursor-pointer bg-blue-600 border border-blue-600 transition-colors hover:bg-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
            Yes, Continue</button>
      </div>
   </div>
</div>

<button type="button" id="openModal"
   class="px-3.5 py-2 text-white text-sm font-semibold rounded-md mx-auto block mt-6 cursor-pointer bg-blue-600 border border-blue-600 transition-colors hover:bg-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
   Open Modal</button>

   <script src="./modal.js"></script>
</body>
</html>
